name: Expense Tracker CI/CD

# Trigger pipeline on every push or pull request to main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ─── JOB 1: Test & Build Frontend ───────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false

      - name: Build app
        working-directory: ./frontend
        run: npm run build

  # ─── JOB 2: Test Backend ─────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test

  # ─── JOB 3: Deploy (only after both jobs pass) ───────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [frontend, backend]   # ← Only runs if CI passes!
    if: github.ref == 'refs/heads/main'  # ← Only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'